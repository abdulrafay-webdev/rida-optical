[project]
name = "rida-optical-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "psycopg-binary>=3.2.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "alembic>=1.13.0",
    "httpx>=0.28.0",
]

[tool.vercel]
entrypoint = "main:app"
